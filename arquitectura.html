<header><img src="logo.png" alt="Don Doblón"><h1>Don Doblon – Architecture</h1></header><p>Private server-side tool used only by the owner of the YouTube channel “Don Doblón” to manage his own channel. Red boxes are the steps that call YouTube APIs.</p><svg viewBox="0 0 1180 560" width="1180" font-family="system-ui,Arial"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect x="10" y="40" width="760" height="505" rx="14" fill="#f3f6fb" stroke="#7d93b8" stroke-dasharray="6 4"/><text x="24" y="64" font-size="14" font-weight="700" fill="#38557f">Owner's private GitHub repository (GitHub Actions jobs + encrypted Secrets)</text><rect x="30" y="85" width="220" height="110" rx="10" fill="#fff7e3" stroke="#b07a00" stroke-width="2"/><text x="140.0" y="109" text-anchor="middle" font-weight="700" font-size="15">1. investigar (daily)</text><text x="140.0" y="131" text-anchor="middle" font-size="12.5" fill="#333">YouTube Data API (API key):</text><text x="140.0" y="149" text-anchor="middle" font-size="12.5" fill="#333">search.list, videos.list</text><text x="140.0" y="167" text-anchor="middle" font-size="12.5" fill="#333">public trending Shorts</text><rect x="290" y="85" width="220" height="110" rx="10" fill="#fff7e3" stroke="#b07a00" stroke-width="2"/><text x="400.0" y="109" text-anchor="middle" font-weight="700" font-size="15">2. Script (owner)</text><text x="400.0" y="131" text-anchor="middle" font-size="12.5" fill="#333">Written daily by the owner</text><text x="400.0" y="149" text-anchor="middle" font-size="12.5" fill="#333">with an AI assistant</text><text x="400.0" y="167" text-anchor="middle" font-size="12.5" fill="#333">on the owner&#x27;s subscription</text><rect x="550" y="85" width="200" height="110" rx="10" fill="#fff7e3" stroke="#b07a00" stroke-width="2"/><text x="650.0" y="109" text-anchor="middle" font-weight="700" font-size="15">3. producir</text><text x="650.0" y="131" text-anchor="middle" font-size="12.5" fill="#333">AI voice (TTS provider)</text><text x="650.0" y="149" text-anchor="middle" font-size="12.5" fill="#333">Animated video render</text><text x="650.0" y="167" text-anchor="middle" font-size="12.5" fill="#333">(Remotion, ffmpeg)</text><rect x="550" y="245" width="200" height="120" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="650.0" y="269" text-anchor="middle" font-weight="700" font-size="15">4. Upload (private)</text><text x="650.0" y="291" text-anchor="middle" font-size="12.5" fill="#333">videos.insert</text><text x="650.0" y="309" text-anchor="middle" font-size="12.5" fill="#333">privacyStatus=private</text><text x="650.0" y="327" text-anchor="middle" font-size="12.5" fill="#333">containsSyntheticMedia=true</text><rect x="290" y="245" width="220" height="120" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="400.0" y="269" text-anchor="middle" font-weight="700" font-size="15">5. revisar</text><text x="400.0" y="291" text-anchor="middle" font-size="12.5" fill="#333">Reads owner&#x27;s Telegram button</text><text x="400.0" y="309" text-anchor="middle" font-size="12.5" fill="#333">Approve → videos.update</text><text x="400.0" y="327" text-anchor="middle" font-size="12.5" fill="#333">(publishAt) · Discard → delete</text><rect x="30" y="245" width="220" height="120" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="140.0" y="269" text-anchor="middle" font-weight="700" font-size="15">6. semana (weekly)</text><text x="140.0" y="291" text-anchor="middle" font-size="12.5" fill="#333">Analytics: reports.query</text><text x="140.0" y="309" text-anchor="middle" font-size="12.5" fill="#333">videos.list (statistics)</text><text x="140.0" y="327" text-anchor="middle" font-size="12.5" fill="#333">commentThreads.list,</text><text x="140" y="345" text-anchor="middle" font-size="12.5" fill="#333">comments.insert</text><rect x="30" y="420" width="340" height="105" rx="10" fill="#eef7ee" stroke="#3f8a4f" stroke-width="2"/><text x="200.0" y="444" text-anchor="middle" font-weight="700" font-size="15">Storage</text><text x="200.0" y="466" text-anchor="middle" font-size="12.5" fill="#333">OAuth refresh token: encrypted GitHub Secret</text><text x="200.0" y="484" text-anchor="middle" font-size="12.5" fill="#333">Own-channel statistics: private repo (JSON)</text><text x="200.0" y="502" text-anchor="middle" font-size="12.5" fill="#333">No data from other users is stored</text><rect x="400" y="420" width="350" height="105" rx="10" fill="#eef3ff" stroke="#4f6fb0" stroke-width="2"/><text x="575.0" y="444" text-anchor="middle" font-weight="700" font-size="15">Owner&#x27;s Telegram (only interface)</text><text x="575.0" y="466" text-anchor="middle" font-size="12.5" fill="#333">Receives each video privately</text><text x="575.0" y="484" text-anchor="middle" font-size="12.5" fill="#333">Buttons: Approve / Discard / Another</text><text x="575.0" y="502" text-anchor="middle" font-size="12.5" fill="#333">Weekly summary</text><rect x="860" y="150" width="290" height="170" rx="10" fill="#fff" stroke="#c4302b" stroke-width="2"/><text x="1005.0" y="174" text-anchor="middle" font-weight="700" font-size="15">YouTube (owner&#x27;s channel only)</text><text x="1005.0" y="196" text-anchor="middle" font-size="12.5" fill="#333">YouTube Data API v3 (OAuth 2.0,</text><text x="1005.0" y="214" text-anchor="middle" font-size="12.5" fill="#333">scopes: youtube.upload,</text><text x="1005.0" y="232" text-anchor="middle" font-size="12.5" fill="#333">youtube.force-ssl)</text><text x="1005.0" y="250" text-anchor="middle" font-size="12.5" fill="#333">YouTube Analytics API</text><text x="1005.0" y="268" text-anchor="middle" font-size="12.5" fill="#333">(yt-analytics.readonly)</text><text x="1005" y="300" text-anchor="middle" font-size="12.5" fill="#c4302b">Called only by steps 4, 5 and 6</text><line x1="250" y1="140" x2="288" y2="140" stroke="#555" stroke-width="2
