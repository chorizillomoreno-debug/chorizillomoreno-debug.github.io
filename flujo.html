 font-weight="700" font-size="15">4. Owner reviews</text><text x="850.0" y="76" text-anchor="middle" font-size="12.5" fill="#333">Telegram message with</text><text x="850.0" y="94" text-anchor="middle" font-size="12.5" fill="#333">the video and buttons:</text><text x="850.0" y="112" text-anchor="middle" font-size="12.5" fill="#333">✅ Approve  ❌ Discard  🔁 Other</text><rect x="990" y="30" width="170" height="110" rx="10" fill="#eef7ee" stroke="#3f8a4f" stroke-width="2"/><text x="1075.0" y="54" text-anchor="middle" font-weight="700" font-size="15">Revoke access</text><text x="1075.0" y="76" text-anchor="middle" font-size="12.5" fill="#333">any time at</text><text x="1075.0" y="94" text-anchor="middle" font-size="12.5" fill="#333">myaccount.google.com</text><text x="1075.0" y="112" text-anchor="middle" font-size="12.5" fill="#333">/permissions</text><rect x="560" y="220" width="200" height="105" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="660.0" y="244" text-anchor="middle" font-weight="700" font-size="15">✅ Approve</text><text x="660.0" y="266" text-anchor="middle" font-size="12.5" fill="#333">videos.update:</text><text x="660.0" y="284" text-anchor="middle" font-size="12.5" fill="#333">scheduled to go public</text><text x="660.0" y="302" text-anchor="middle" font-size="12.5" fill="#333">at the best hour</text><rect x="790" y="220" width="170" height="105" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="875.0" y="244" text-anchor="middle" font-weight="700" font-size="15">❌ Discard</text><text x="875.0" y="266" text-anchor="middle" font-size="12.5" fill="#333">videos.delete:</text><text x="875.0" y="284" text-anchor="middle" font-size="12.5" fill="#333">removed from YouTube</text><rect x="990" y="220" width="170" height="105" rx="10" fill="#fff7e3" stroke="#b07a00" stroke-width="2"/><text x="1075.0" y="244" text-anchor="middle" font-weight="700" font-size="15">🔁 Other</text><text x="1075.0" y="266" text-anchor="middle" font-size="12.5" fill="#333">the reserve video is</text><text x="1075.0" y="284" text-anchor="middle" font-size="12.5" fill="#333">produced and sent</text><text x="1075.0" y="302" text-anchor="middle" font-size="12.5" fill="#333">(back to step 2)</text><rect x="300" y="330" width="420" height="110" rx="10" fill="#fde8e8" stroke="#c4302b" stroke-width="2"/><text x="510.0" y="354" text-anchor="middle" font-weight="700" font-size="15">5. Every week</text><text x="510.0" y="376" text-anchor="middle" font-size="12.5" fill="#333">Own-channel statistics (Analytics API) to learn which</text><text x="510.0" y="394" text-anchor="middle" font-size="12.5" fill="#333">topics and hours work best; short replies from the channel</text><text x="510.0" y="412" text-anchor="middle" font-size="12.5" fill="#333">to comments on its own videos (max 25/week)</text><line x1="220" y1="85" x2="258" y2="85" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="460" y1="85" x2="498" y2="85" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="710" y1="85" x2="748" y2="85" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="820" y1="140" x2="680" y2="218" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="850" y1="140" x2="872" y2="218" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="900" y1="140" x2="1060" y2="218" stroke="#555" stroke-width="2" marker-end="url(#a)"/></svg><footer><a href="index.html">Inicio</a> · <a href="privacidad.html">Política de privacidad</a> · <a href="condiciones.html">Condiciones del servicio</a> · <a href="arquitectura.html">Architecture</a> · <a href="flujo.html">User flow</a> · <a href="subida.html">Upload script</a></footer></body></html>
